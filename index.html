<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Renderer lockdown: no remote scripts/frames/plugins. Inline script/style are needed by
         Vite's dev preamble and the startup splash; remote images are allowed for thumbnails.
         Dev-server websocket (HMR) is allowed for localhost only. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self' data:; media-src 'self' blob: data:; connect-src 'self' ws://localhost:* http://localhost:*; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OPNduck</title>
    <script>
      /* Apply the saved theme before first paint so the splash (and the flash-free
         background) match it. Mirrors applyTheme() in src/themes/theme.ts; live Omarchy and
         palette colours are cached by omarchySync.ts. */
      try {
        var t = localStorage.getItem('opnduck.theme') || 'blarange';
        var el = document.documentElement;
        el.setAttribute('data-theme', t === 'blarange' || t === 'monochrome' ? t : 'omarchy');
        if (t !== 'blarange' && t !== 'monochrome') {
          var c = JSON.parse(localStorage.getItem('opnduck.themeTokens') || '{}');
          for (var k in c) el.style.setProperty(k, c[k]);
        }
      } catch (e) {}
    </script>
    <style>
      /* Prevent the white/transparent startup flash at the root level.
         Matches Blarange's --bg-solid (#17130f); the theme's own --bg-base
         takes over once React mounts. */
      html, body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-solid, #17130f);
        width: 100%;
        height: 100%;
      }

      /* Startup splash. It uses the theme's own tokens, so it matches whichever theme was
         chosen; the script below applies the saved theme before first paint. */
      #startup-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: var(--bg-solid, #0f0c0a);
        color: var(--text, #ede6d9);
        transition: opacity 0.4s ease, visibility 0.4s;
      }
      .splash-word {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 26px;
        font-weight: 800;
        letter-spacing: 0.12em;
      }
      .splash-word b {
        color: var(--accent, #e1892f);
        font-weight: 800;
      }
      .splash-track {
        position: relative;
        width: 160px;
        height: 2px;
        overflow: hidden;
        background: color-mix(in srgb, var(--accent, #e1892f) 18%, transparent);
      }
      .splash-track::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        background: var(--accent, #e1892f);
        animation: splash-run 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes splash-run {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-track::after { animation: none; width: 100%; opacity: 0.5; }
      }
    </style>
  </head>
  <body>
    <!-- Splash Screen shown before React mounts -->
    <div id="startup-splash">
      <div class="splash-word"><b>OPN</b>duck</div>
      <div class="splash-track"></div>
    </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
