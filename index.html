<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Renderer lockdown: no remote scripts/frames/plugins. Inline script/style are needed by
         Vite's dev preamble and the startup splash; remote images are allowed for thumbnails.
         Dev-server websocket (HMR) is allowed for localhost only. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self' data:; media-src 'self' blob: data:; connect-src 'self' ws://localhost:* http://localhost:*; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OPNduck</title>
    <style>
      /* Prevent the white/transparent startup flash at the root level.
         Matches Blarange's --bg-solid (#17130f); the theme's own --bg-base
         takes over once React mounts. */
      html, body {
        margin: 0;
        padding: 0;
        background-color: #17130f;
        width: 100%;
        height: 100%;
      }

      /* Static Splash Loading Screen — scoped to itself so it never locks
         page scroll once React mounts and hides it. */
      #startup-splash {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background-color: #0f0c0a;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        transition: opacity 0.4s ease, visibility 0.4s;
      }

      .splash-logo {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 28px;
        font-weight: 800;
        letter-spacing: 3px;
        background: linear-gradient(90deg, #f0a63b, #e1892f, #d97a25);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 24px;
      }

      .splash-loader-bar {
        width: 240px;
        height: 4px;
        background: rgba(225, 137, 47, 0.12);
        border-radius: 4px;
        overflow: hidden;
        border: 1px solid rgba(225, 137, 47, 0.18);
      }

      .splash-progress {
        width: 60%;
        height: 100%;
        background: linear-gradient(90deg, #e1892f, #f0a63b);
        border-radius: 4px;
        animation: loading-animation 1.6s infinite ease-in-out;
      }

      @keyframes loading-animation {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(100%); }
        100% { transform: translateX(-100%); }
      }
    </style>
  </head>
  <body>
    <!-- Splash Screen shown before React mounts -->
    <div id="startup-splash">
      <div class="splash-logo">OPNDUCK</div>
      <div class="splash-loader-bar">
        <div class="splash-progress"></div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
