<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Renderer lockdown: no remote scripts/frames/plugins. Inline script/style are needed by
         Vite's dev preamble and the startup splash; remote images are allowed for thumbnails.
         Dev-server websocket (HMR) is allowed for localhost only. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self' data:; media-src 'self' blob: data:; connect-src 'self' ws://localhost:* http://localhost:*; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OPNduck</title>
    <script>
      /* Apply the saved theme before first paint so the splash (and the flash-free
         background) match it. Mirrors applyTheme() in src/themes/theme.ts; live Omarchy and
         palette colours are cached by omarchySync.ts. */
      try {
        var t = localStorage.getItem('opnduck.theme') || 'blarange';
        var el = document.documentElement;
        el.setAttribute('data-theme', t === 'blarange' || t === 'monochrome' ? t : 'omarchy');
        if (t !== 'blarange' && t !== 'monochrome') {
          var c = JSON.parse(localStorage.getItem('opnduck.themeTokens') || '{}');
          for (var k in c) el.style.setProperty(k, c[k]);
        }
      } catch (e) {}
    </script>
    <style>
      /* Prevent the white/transparent startup flash at the root level.
         Matches Blarange's --bg-solid (#17130f); the theme's own --bg-base
         takes over once React mounts. */
      html, body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-solid, #131110);
        width: 100%;
        height: 100%;
      }

      /* Startup splash. It uses the theme's own tokens, so it matches whichever theme was
         chosen; the script below applies the saved theme before first paint. */
      #startup-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: var(--bg-solid, #131110);
        color: var(--text, #ede6d9);
        transition: opacity 0.4s ease, visibility 0.4s;
      }
      .splash-duck {
        width: 84px;
        height: 84px;
        color: var(--accent, #e1892f);
        animation: splash-bob 1.4s ease-in-out infinite;
        transform-origin: 50% 90%;
      }
      .splash-duck .eye { fill: var(--bg-solid, #131110); }
      .splash-waves {
        width: 168px;
        height: 14px;
        margin-top: -32px;
        overflow: hidden;
        color: var(--accent, #e1892f);
      }
      .splash-waves svg {
        display: block;
        width: 336px;
        height: 14px;
        animation: splash-drift 1.6s linear infinite;
      }
      .splash-word {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: 0.12em;
        display: flex;
        color: var(--accent, #e1892f);
        text-shadow: 0 0 14px color-mix(in srgb, var(--accent, #e1892f) 45%, transparent);
      }
      .splash-word span {
        display: inline-block;
        animation: splash-pop 1.8s cubic-bezier(0.3, 1.4, 0.5, 1) infinite;
        animation-delay: calc(var(--i) * 70ms);
      }
      @keyframes splash-bob {
        0%, 100% { transform: translateY(0) rotate(-3deg); }
        50% { transform: translateY(-7px) rotate(3deg); }
      }
      @keyframes splash-drift {
        to { transform: translateX(-168px); }
      }
      @keyframes splash-pop {
        0%, 55%, 100% { transform: translateY(0); }
        20% { transform: translateY(-7px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-duck, .splash-waves svg, .splash-word span { animation: none; }
      }
    </style>
  </head>
  <body>
    <!-- Splash Screen shown before React mounts -->
    <div id="startup-splash">
      <svg class="splash-duck" viewBox="0 0 64 64" aria-hidden="true">
        <path fill="currentColor" d="M10 38c0-8 7-13 15-13h4c-2-9 3-17 12-17 8 0 13 6 13 13 0 0-1 0-2 0l7 3-7 3c-1 14-8 23-18 23H26C16 49 10 45 10 38z"/>
        <path fill="currentColor" opacity=".55" d="M24 38c0 5 5 8 11 8 7 0 12-3 13-8-5 2-10 2-14 1-4-1-7-3-10-1z"/>
        <circle class="eye" cx="45" cy="17" r="2.4"/>
      </svg>
      <div class="splash-waves"><svg viewBox="0 0 336 14" aria-hidden="true"><path d="M0 7 q10.5 -8 21 0 t21 0 t21 0 t21 0 t21 0 t21 0 t21 0 t21 0 t21 0 t21 0 t21 0 t21 0 t21 0 t21 0 t21 0 t21 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.7"/></svg></div>
      <div class="splash-word" aria-label="OPNduck"><span style="--i:0">O</span><span style="--i:1">P</span><span style="--i:2">N</span><span style="--i:3">d</span><span style="--i:4">u</span><span style="--i:5">c</span><span style="--i:6">k</span></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
