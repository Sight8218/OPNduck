<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Send to OPNduck</title>
  <meta name="theme-color" content="#131110">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; connect-src https: http://127.0.0.1:* http://localhost:*; manifest-src 'self'; base-uri 'none'; form-action 'none'">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    :root { --bg: #131110; --panel: #1d1a18; --line: #3a3430; --text: #ede6d9; --dim: #a79d8f; --accent: #e1892f; --bad: #f87171; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 ui-monospace, "JetBrains Mono", SFMono-Regular, Menlo, Consolas, monospace; min-height: 100vh; padding: max(16px, env(safe-area-inset-top)) 16px 32px; }
    main { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
    h1 { font-size: 22px; margin: 8px 0 0; display: flex; gap: 10px; align-items: center; }
    h1 img { width: 36px; height: 36px; border-radius: 8px; }
    p, label, small { color: var(--dim); font-size: 14px; margin: 0; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    input, textarea { width: 100%; background: #0d0b0a; color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font: inherit; }
    input:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    button { background: var(--accent); color: #131110; border: 0; border-radius: 12px; padding: 14px 16px; font: inherit; font-weight: 700; cursor: pointer; }
    button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); font-weight: 600; }
    button:disabled { opacity: .5; cursor: default; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .row > * { flex: 1 1 140px; }
    #status { min-height: 1.5em; font-size: 14px; }
    #status.ok { color: #86efac; } #status.bad { color: var(--bad); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <h1><img src="icon-192.png" alt="" width="36" height="36"> Send to OPNduck</h1>

  <section id="pair" class="card" hidden>
    <p>Not paired yet. In OPNduck, open <b>Settings → Send to OPNduck</b> and scan the code with your camera, or paste the pair link here.</p>
    <input id="pairlink" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Paste the pair link">
    <button id="dopair" type="button">Pair</button>
    <small id="pairmsg"></small>
  </section>

  <section id="send" class="card" hidden>
    <p>Paired with <b id="who"></b>. <button id="unpair" class="ghost" type="button" style="padding:4px 10px;font-size:13px">Unpair</button></p>
    <label for="url">Link to send</label>
    <input id="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://…">
    <div class="row">
      <button id="paste" type="button" class="ghost">Paste &amp; send</button>
      <button id="go" type="button">Send</button>
    </div>
    <label for="device">This device's name</label>
    <input id="device" maxlength="40" autocomplete="off">
    <div id="status" role="status" aria-live="polite"></div>
  </section>

  <small>Only the link is sent, end-to-end encrypted. OPNduck chooses the format and folder. <a style="color:var(--accent)" href="https://github.com/Sight8218/OPNduck">About OPNduck</a></small>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
