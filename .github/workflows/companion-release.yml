# Builds the Android companion app (companion/) with Gradle.
#   - Every pull request that touches it: a debug APK, to prove it still builds.
#   - When a GitHub release is published: a release APK, signed when the signing secrets exist, attached to the release.
# Secrets (Settings > Secrets and variables > Actions), all optional until you want a signed APK:
#   ANDROID_KEYSTORE_BASE64  the keystore file, base64 encoded (base64 -w0 opnduck.jks)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Without them the release APK is attached unsigned (Android will not install it; F-Droid signs its own build).
name: Companion app

on:
  pull_request:
    paths: ['companion/**', 'extension/lib/**', '.github/workflows/companion-release.yml']
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: companion/package-lock.json
      # Gradle 8 does not run on newer JDKs, so the build pins 21.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build && npx cap sync android
      - name: Debug APK (pull requests)
        if: github.event_name != 'release'
        working-directory: companion/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Release APK
        if: github.event_name == 'release'
        working-directory: companion/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          OPNDUCK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OPNDUCK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OPNDUCK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/opnduck.jks"
            export OPNDUCK_KEYSTORE="$RUNNER_TEMP/opnduck.jks"
          else
            echo "No signing key: building an unsigned APK"
          fi
          ./gradlew assembleRelease --no-daemon
          cd app/build/outputs/apk/release
          for f in *.apk; do mv "$f" "opnduck-companion-${GITHUB_REF_NAME}-${f#app-}"; done
      - uses: actions/upload-artifact@v7
        with:
          name: companion-apk
          path: companion/android/app/build/outputs/apk/*/*.apk
          if-no-files-found: error
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" android/app/build/outputs/apk/release/*.apk --clobber
