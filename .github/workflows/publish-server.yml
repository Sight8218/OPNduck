# Builds OPNduck Server (server/Dockerfile) on every pull request that touches it, proves the container works by running
# a real FFmpeg conversion through the Engine API, and publishes ghcr.io/sight8218/opnduck-server when a release is
# published. Uses only the built-in GITHUB_TOKEN.
name: OPNduck Server

on:
  pull_request:
    paths: ['server/**', 'engine-api/**', 'electron/core/**', 'scripts/build-server.mjs', '.github/workflows/publish-server.yml']
  release:
    types: [published]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/sight8218/opnduck-server

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          target: latest
          load: true
          tags: opnduck-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start it
        run: |
          docker run -d --name opnduck -p 127.0.0.1:47821:47821 -e OPNDUCK_UPDATE_YTDLP=0 opnduck-server:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:47821/v1/health && break; sleep 1; done
      - name: Pair, upload a video and convert it through the API
        run: |
          sudo apt-get install -y --no-install-recommends ffmpeg >/dev/null
          ffmpeg -loglevel error -f lavfi -i testsrc=duration=2:size=320x240:rate=15 -f lavfi -i sine=duration=2 -c:v libx264 -c:a aac -shortest /tmp/in.mp4
          CODE=$(docker exec opnduck opnduck-server pair | grep -o 'c=[A-Za-z0-9_-]*' | head -1 | cut -c3-)
          node server/ci-smoke.mjs /tmp/in.mp4 "$CODE"
      - name: Show the server log if something failed
        if: failure()
        run: docker logs opnduck

  publish:
    if: github.event_name == 'release'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Build and push the default image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          target: latest
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
          cache-from: type=gha
      - name: Build and push the full image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          target: full
          push: true
          tags: ${{ env.IMAGE }}:full
          cache-from: type=gha
