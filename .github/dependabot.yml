# Dependabot version updates (free for public repositories).
# Everything in package.json is a build tool (OPNduck ships no runtime dependencies), so updates are grouped
# into one pull request a week to keep the noise down. Security updates come separately and right away.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Electron majors change the bundled Chromium/Node; those are upgraded by hand after testing the app.
      - dependency-name: electron
        update-types: [version-update:semver-major]
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
