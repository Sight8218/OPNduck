<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="duck-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fef08a"/>
      <stop offset="0.45" stop-color="#f97316"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7a1200"/>
      <stop offset="1" stop-color="#4a0a04"/>
    </linearGradient>
  </defs>

  <!-- Rounded tile -->
  <rect width="64" height="64" rx="16" fill="url(#bg-grad)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- Duck silhouette -->
  <g transform="translate(8 13)">
    <!-- body -->
    <path d="M31 4c6.5 0 12 4.4 13.8 10.3 1.9-.8 4.1-.6 5.8.7 1.6 1.2 2.4 3.1 2.2 5-.3 2.7-2.5 5-5.3 5.3-1.7.2-3.3-.3-4.6-1.3-.6 3.9-3.4 7.3-7.2 8.9a21 21 0 0 1-3 15.4c.4 1-1 1.7-1.8 1-3.1-2.7-5.3-6.2-6.4-10-2.5-3-4-6.8-4.4-10.9C11.6 24.4 21.6 14 31 4Z"
          fill="url(#duck-grad)" stroke="#1a0500" stroke-opacity="0.25" stroke-width="1"/>
    <!-- eye -->
    <circle cx="38.5" cy="16.5" r="2.3" fill="#3a0a00"/>
    <!-- highlight -->
    <circle cx="39.2" cy="15.8" r="0.8" fill="#ffffff" fill-opacity="0.85"/>
    <!-- beak -->
    <path d="M43.5 21.5c3 .3 5.4 2.3 6 5 .3 1.2-.6 1.9-1.6 1.6-3.2-.9-5.5-3.6-6.2-6.6Z" fill="#b45309"/>
  </g>
</svg>